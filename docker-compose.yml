services:
  link-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: link-dashboard:local
    container_name: link-dashboard
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      LINKBOARD_HOST: 0.0.0.0
      LINKBOARD_PORT: 8080
      LINKBOARD_DB_PATH: /data/linkdashboard.db
    volumes:
      - ./data:/data
